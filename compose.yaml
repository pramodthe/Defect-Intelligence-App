name: defect-intelligence
x-app: &app
  build: .
  env_file: .env
  environment: &environment
    WORKSPACE_ROOT: /workspace
    CHECKPOINT_BACKEND: postgres
    LANGGRAPH_CHECKPOINT_DSN: postgresql://defect:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/checkpoints
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    QDRANT_URL: http://qdrant:6333
    QDRANT_KEY: ${QDRANT_KEY:?Set QDRANT_KEY in .env}
    TOKENIZER_PATH: ${CONTAINER_BGE_PATH:-}
    EMBEDDING_PATH: ${CONTAINER_BGE_PATH:-}
    DOCLING_ARTIFACTS_PATH: ${CONTAINER_DOCLING_PATH:-}
    TEXT_PROVIDER: ${TEXT_PROVIDER:-disabled}
    VISION_ENABLED: false
  volumes:
    - workspace:/workspace
    - ./.cache/models:/models:ro
  depends_on:
    postgres:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    qdrant:
      condition: service_started
  restart: unless-stopped
services:
  api:
    <<: *app
    ports:
      - 127.0.0.1:8000:8000
    command: ["sh","-c","alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
  worker:
    <<: *app
    command: ["python","-u","-m","app.worker"]
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - graph:/data
    healthcheck:
      test: ["CMD-SHELL","cypher-shell -u neo4j -p \"$$NEO4J_AUTH\" 'RETURN 1' >/dev/null 2>&1 || cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 15
  qdrant:
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_KEY}
    volumes:
      - vectors:/qdrant/storage
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: checkpoints
      POSTGRES_USER: defect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - checkpoints:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U defect -d checkpoints"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  workspace:
  graph:
  vectors:
  checkpoints:
