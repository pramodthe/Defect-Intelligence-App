[project]
name = "defect-intelligence"
version = "0.1.0"
description = "Local, source-preserving building defect research"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3", "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3", "aiosqlite>=0.21,<1", "alembic>=1.15,<2",
  "langgraph>=1.2.12,<2", "langchain-core>=1.0,<2",
  "langchain-openai>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "langgraph-checkpoint-sqlite>=3,<4",
  "psycopg[binary,pool]>=3.2,<4", "python-docx>=1.2,<2", "lxml>=5.4,<7",
  "pillow>=11,<13", "pypdfium2>=4.30,<6", "rapidocr>=3.4,<4",
  "onnxruntime>=1.20,<2", "qdrant-client>=1.14,<2", "neo4j>=5.28,<6",
  "rdflib>=7.1,<8", "openai>=2,<3", "httpx>=0.28,<1",
  "transformers>=4.51,<6", "numpy>=2,<3"
]
[project.optional-dependencies]
models = ["sentence-transformers>=5,<6", "docling>=2.50,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.26,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "reportlab>=4,<5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
[tool.ruff.lint.per-file-ignores]
# These local closures execute synchronously before the loop advances; none escape the iteration.
"app/ingestion.py" = ["B023"]
"app/chunking.py" = ["B023"]
# FastAPI dependency declarations intentionally use descriptor calls in defaults.
"app/main.py" = ["B008"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
